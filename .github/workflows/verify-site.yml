name: Verify heritage site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test desktop, iPhone and Android layouts
        working-directory: ${{ runner.temp }}
        env:
          SITE: ${{ github.workspace }}
        run: |
          set -eu
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$SITE" >/dev/null 2>&1 &
          node --input-type=module <<'JS'
          import { chromium, webkit, devices } from 'playwright';
          import assert from 'node:assert/strict';
          for (const [name, engine, options] of [
            ['Desktop', chromium, {viewport:{width:1440,height:900}}],
            ['iPhone', webkit, devices['iPhone 13']],
            ['Android', chromium, devices['Pixel 7']]
          ]) {
            const browser = await engine.launch();
            try {
              const page = await browser.newPage(options);
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              page.on('response', r => { if (r.status() >= 400) errors.push(r.url()); });
              await page.goto('http://127.0.0.1:8123/');
              assert.equal(await page.locator('h1').innerText(), 'A Legacy on Wheels');
              assert(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth));
              for (const link of await page.locator('nav a').all()) {
                await link.click();
                const anchor = await link.getAttribute('href');
                assert.equal(await page.locator(anchor).count(), 1);
              }
              await page.locator('label[for=now]').click();
              assert(await page.locator('.current').isVisible());
              await page.locator('label[for=then]').click();
              assert(await page.locator('.past').isVisible());
              for (const img of await page.locator('main img').all()) {
                await img.scrollIntoViewIfNeeded();
                await img.evaluate(i => i.decode());
                assert(await img.getAttribute('alt'));
              }
              await page.locator('.grid a').first().click();
              await page.locator('#next').click();
              assert.match(await page.locator('#caption').innerText(), /^2 \/ /);
              await page.keyboard.press('ArrowLeft');
              assert.match(await page.locator('#caption').innerText(), /^1 \/ /);
              await page.keyboard.press('Escape');
              assert.equal(await page.locator('dialog').isVisible(), false);
              assert.deepEqual(errors, []);
              console.log(name + ' passed');
            } finally { await browser.close(); }
          }
          JS
      - name: Enable publication from main and verify public content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" --silent; then
            echo '{"source":{"branch":"main","path":"/"},"build_type":"legacy"}' | gh api --method POST "repos/$GITHUB_REPOSITORY/pages" --input - --silent
          fi
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 10 https://deadpoolctr.github.io/Model-a-/ -o "$RUNNER_TEMP/live.html" && cmp -s index.html "$RUNNER_TEMP/live.html"; then
              curl -fsS -o /dev/null https://deadpoolctr.github.io/Model-a-/photos/owner-cognac.jpg
              exit 0
            fi
            sleep 6
          done
          exit 1
